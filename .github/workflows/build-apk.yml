name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: App config
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "ir.dakhlkharj.app",
            "appName": "دخل و خرج خانه",
            "webDir": "www",
            "plugins": {
              "LocalNotifications": { "iconColor": "#0F5A4B" }
            }
          }
          JSON
      - name: Persian OCR files
        run: |
          npm install --no-save tesseract.js@5 tesseract.js-core@5 @tesseract.js-data/fas @tesseract.js-data/eng || echo "ocr packages skipped"
          mkdir -p www/ocr
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js www/ocr/ || true
          cp node_modules/tesseract.js-core/tesseract-core*.js www/ocr/ || true
          cp node_modules/tesseract.js-core/tesseract-core*.wasm www/ocr/ || true
          find node_modules/@tesseract.js-data -name "*best_int*" -prune -o -name "*.traineddata.gz" -print -exec cp {} www/ocr/ \; || true
          find node_modules/@tesseract.js-data -path "*best_int*" -name "*.traineddata.gz" -exec cp {} www/ocr/ \; || true
          ls -la www/ocr || true
      - run: npx cap add android
      - run: npx cap sync android
      - name: Permissions
        run: sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: App icon and splash
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow || true
          python3 - <<'PY'
          import os, glob
          from PIL import Image, ImageDraw
          src = Image.open('icon.png').convert('RGBA')
          R = 'android/app/src/main/res'
          bg = (245, 243, 238, 255)
          def placed(size, frac, shape=None):
              out = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              base = Image.new('RGBA', (size, size), bg) if shape else Image.new('RGBA', (size, size), (0, 0, 0, 0))
              ic = src.resize((int(size * frac),) * 2, Image.LANCZOS)
              base.paste(ic, ((size - ic.width) // 2,) * 2, ic)
              if not shape:
                  return base
              m = Image.new('L', (size, size), 0)
              d = ImageDraw.Draw(m)
              if shape == 'round':
                  d.ellipse([0, 0, size - 1, size - 1], fill=255)
              else:
                  d.rounded_rectangle([0, 0, size - 1, size - 1], radius=size // 5, fill=255)
              out.paste(base, (0, 0), m)
              return out
          for dens, s in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              p = f'{R}/mipmap-{dens}'
              os.makedirs(p, exist_ok=True)
              placed(s, 0.84, 'square').save(f'{p}/ic_launcher.png')
              placed(s, 0.74, 'round').save(f'{p}/ic_launcher_round.png')
              f = s * 108 // 48
              placed(f, 0.60).save(f'{p}/ic_launcher_foreground.png')
          os.makedirs(f'{R}/mipmap-anydpi-v26', exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(f'{R}/mipmap-anydpi-v26/{n}', 'w').write(xml)
          os.makedirs(f'{R}/values', exist_ok=True)
          open(f'{R}/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#F5F3EE</color>\n</resources>\n')
          for sp in glob.glob(f'{R}/drawable*/splash.png'):
              w, h = Image.open(sp).size
              im = Image.new('RGBA', (w, h), bg)
              k = int(min(w, h) * 0.38)
              ic = src.resize((k, k), Image.LANCZOS)
              im.paste(ic, ((w - k) // 2, (h - k) // 2), ic)
              im.convert('RGB').save(sp)
          print('icons ok')
          PY
      - name: Fixed signing key and version
        run: |
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          sed -i -E "s/versionCode [0-9]+/versionCode $((100 + ${{ github.run_number }}))/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  fixedKey {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixedKey }
              }
          }
          GRADLE
          grep -n "versionCode" android/app/build.gradle
          keytool -list -v -keystore debug.keystore -storepass android | grep -i "SHA256" | head -1
      - name: Native features (SMS, fingerprint, widget)
        run: |
          mkdir -p bak app/src/main/java/ir/dakhlkharj/app android/app/src/main/res/layout android/app/src/main/res/xml android/app/src/main/res/drawable
          cp android/app/src/main/AndroidManifest.xml bak/ && cp android/app/build.gradle bak/ && cp android/app/src/main/java/ir/dakhlkharj/app/MainActivity.java bak/
          cat > android/app/src/main/java/ir/dakhlkharj/app/HomeNativePlugin.java <<'JAVA1'
          package ir.dakhlkharj.app;

          import android.Manifest;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.net.Uri;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.util.concurrent.Executor;

          @CapacitorPlugin(name = "HomeNative", permissions = { @Permission(alias = "sms", strings = { Manifest.permission.READ_SMS }) })
          public class HomeNativePlugin extends Plugin {

              @PluginMethod
              public void readSms(PluginCall call) {
                  if (getPermissionState("sms") != PermissionState.GRANTED) {
                      requestPermissionForAlias("sms", call, "smsPermCallback");
                      return;
                  }
                  doReadSms(call);
              }

              @PermissionCallback
              private void smsPermCallback(PluginCall call) {
                  if (getPermissionState("sms") == PermissionState.GRANTED) doReadSms(call);
                  else call.reject("denied");
              }

              private void doReadSms(PluginCall call) {
                  long since = 0L;
                  try { since = Long.parseLong(call.getString("since", "0")); } catch (Exception ignored) {}
                  JSArray arr = new JSArray();
                  Cursor c = null;
                  try {
                      c = getContext().getContentResolver().query(Uri.parse("content://sms/inbox"),
                          new String[] { "address", "body", "date" }, "date > ?", new String[] { String.valueOf(since) }, "date DESC");
                      int n = 0;
                      while (c != null && c.moveToNext() && n < 300) {
                          JSObject o = new JSObject();
                          o.put("address", c.getString(0));
                          o.put("body", c.getString(1));
                          o.put("date", c.getLong(2));
                          arr.put(o);
                          n++;
                      }
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                      return;
                  } finally {
                      if (c != null) c.close();
                  }
                  JSObject r = new JSObject();
                  r.put("messages", arr);
                  call.resolve(r);
              }

              @PluginMethod
              public void bioAuth(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      try {
                          Executor ex = ContextCompat.getMainExecutor(getContext());
                          BiometricPrompt bp = new BiometricPrompt(getActivity(), ex, new BiometricPrompt.AuthenticationCallback() {
                              @Override
                              public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) { call.resolve(); }
                              @Override
                              public void onAuthenticationError(int code, CharSequence msg) { call.reject(String.valueOf(msg)); }
                          });
                          BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                              .setTitle("ورود به دخل و خرج خانه")
                              .setNegativeButtonText("انصراف")
                              .setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_WEAK)
                              .build();
                          bp.authenticate(info);
                      } catch (Exception e) {
                          call.reject(String.valueOf(e.getMessage()));
                      }
                  });
              }


              @PluginMethod
              public void startSync(PluginCall call) {
                  android.content.SharedPreferences sp = getContext().getSharedPreferences(SyncService.PREFS, Context.MODE_PRIVATE);
                  android.content.SharedPreferences.Editor e = sp.edit()
                      .putString("url", call.getString("url", ""))
                      .putString("key", call.getString("key", ""))
                      .putString("home", call.getString("home", ""))
                      .putString("code", call.getString("code", ""))
                      .putString("me", call.getString("me", ""))
                      .putBoolean("on", true);
                  if (!call.getString("home", "").equals(sp.getString("home", ""))) e.putLong("csince", 0).putLong("hsince", 0);
                  e.apply();
                  try {
                      ContextCompat.startForegroundService(getContext(), new android.content.Intent(getContext(), SyncService.class));
                      call.resolve();
                  } catch (Exception ex) { call.reject(String.valueOf(ex.getMessage())); }
              }

              @PluginMethod
              public void stopSync(PluginCall call) {
                  getContext().getSharedPreferences(SyncService.PREFS, Context.MODE_PRIVATE).edit().putBoolean("on", false).apply();
                  getContext().stopService(new android.content.Intent(getContext(), SyncService.class));
                  call.resolve();
              }

              @PluginMethod
              public void setVisible(PluginCall call) {
                  getContext().getSharedPreferences(SyncService.PREFS, Context.MODE_PRIVATE).edit().putBoolean("visible", Boolean.TRUE.equals(call.getBoolean("v", false))).apply();
                  call.resolve();
              }

              @PluginMethod
              public void setWidget(PluginCall call) {
                  SharedPreferences sp = getContext().getSharedPreferences("home_widget", Context.MODE_PRIVATE);
                  sp.edit()
                      .putString("title", call.getString("title", ""))
                      .putString("line1", call.getString("line1", ""))
                      .putString("line2", call.getString("line2", ""))
                      .putString("line3", call.getString("line3", ""))
                      .apply();
                  HomeWidget.refresh(getContext());
                  call.resolve();
              }
          }
          JAVA1
          cat > android/app/src/main/java/ir/dakhlkharj/app/HomeWidget.java <<'JAVA2'
          package ir.dakhlkharj.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;

          public class HomeWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context ctx, AppWidgetManager m, int[] ids) {
                  for (int id : ids) draw(ctx, m, id);
              }

              static void draw(Context ctx, AppWidgetManager m, int id) {
                  SharedPreferences sp = ctx.getSharedPreferences("home_widget", Context.MODE_PRIVATE);
                  RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.home_widget);
                  v.setTextViewText(R.id.w_title, sp.getString("title", "دخل و خرج خانه"));
                  v.setTextViewText(R.id.w_line1, sp.getString("line1", "اپ را یک بار باز کن"));
                  v.setTextViewText(R.id.w_line2, sp.getString("line2", ""));
                  v.setTextViewText(R.id.w_line3, sp.getString("line3", ""));
                  Intent i = ctx.getPackageManager().getLaunchIntentForPackage(ctx.getPackageName());
                  if (i != null) {
                      PendingIntent pi = PendingIntent.getActivity(ctx, 0, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      v.setOnClickPendingIntent(R.id.w_root, pi);
                  }
                  m.updateAppWidget(id, v);
              }

              static void refresh(Context ctx) {
                  AppWidgetManager m = AppWidgetManager.getInstance(ctx);
                  int[] ids = m.getAppWidgetIds(new ComponentName(ctx, HomeWidget.class));
                  for (int id : ids) draw(ctx, m, id);
              }
          }
          JAVA2
          cat > android/app/src/main/java/ir/dakhlkharj/app/MainActivity.java <<'JAVA3'
          package ir.dakhlkharj.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(HomeNativePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA3
          cat > android/app/src/main/java/ir/dakhlkharj/app/SyncService.java <<'JAVA4'
          package ir.dakhlkharj.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class SyncService extends Service {
              static final String PREFS = "home_sync";
              static final String CH_MSG = "family_messages";
              static final String CH_SVC = "family_service";
              private volatile boolean running = false;
              private Thread worker;
              private PowerManager.WakeLock wl;
              private int nid = 1000;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  channels();
                  Intent li = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  PendingIntent pi = PendingIntent.getActivity(this, 0, li, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new NotificationCompat.Builder(this, CH_SVC)
                      .setSmallIcon(getApplicationInfo().icon)
                      .setContentTitle("دخل و خرج خانه")
                      .setContentText("اعلان‌های خانواده فعال است")
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .setContentIntent(pi)
                      .build();
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  else startForeground(1, n);
                  if (!running) {
                      running = true;
                      try {
                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "dakhlkharj:sync");
                          wl.acquire();
                      } catch (Exception ignored) {}
                      worker = new Thread(() -> {
                          while (running) {
                              try { poll(); } catch (Exception ignored) {}
                              try { Thread.sleep(25000); } catch (InterruptedException e) { break; }
                          }
                      });
                      worker.start();
                  }
                  return START_STICKY;
              }

              private void channels() {
                  if (Build.VERSION.SDK_INT < 26) return;
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  NotificationChannel m = new NotificationChannel(CH_MSG, "پیام‌ها و لیست خرید خانواده", NotificationManager.IMPORTANCE_HIGH);
                  m.enableVibration(true);
                  nm.createNotificationChannel(m);
                  NotificationChannel s = new NotificationChannel(CH_SVC, "سرویس همگام‌سازی", NotificationManager.IMPORTANCE_MIN);
                  s.setShowBadge(false);
                  nm.createNotificationChannel(s);
              }

              private String post(String url, String key, String body) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(15000);
                  c.setRequestMethod("POST");
                  c.setDoOutput(true);
                  c.setRequestProperty("apikey", key);
                  c.setRequestProperty("Content-Type", "application/json");
                  try (OutputStream os = c.getOutputStream()) { os.write(body.getBytes("UTF-8")); }
                  StringBuilder sb = new StringBuilder();
                  try (BufferedReader br = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"))) {
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line);
                  }
                  return sb.toString();
              }

              private void poll() throws Exception {
                  SharedPreferences sp = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String url = sp.getString("url", ""), key = sp.getString("key", ""), home = sp.getString("home", ""), code = sp.getString("code", ""), me = sp.getString("me", "");
                  if (home.isEmpty() || url.isEmpty()) return;
                  boolean visible = sp.getBoolean("visible", false);
                  long now = System.currentTimeMillis();
                  long cs = sp.getLong("csince", 0), hs = sp.getLong("hsince", 0);
                  if (cs == 0) cs = now;
                  if (hs == 0) hs = now;
                  long cmx = cs, hmx = hs;

                  JSONObject b = new JSONObject();
                  b.put("p_home", home); b.put("p_code", code); b.put("p_since", cs);
                  JSONArray msgs = new JSONArray(post(url + "/rest/v1/rpc/chat_peek", key, b.toString()));
                  for (int i = 0; i < msgs.length(); i++) {
                      JSONObject m = msgs.getJSONObject(i);
                      long t = m.optLong("t");
                      if (t > cmx) cmx = t;
                      String ub = m.optString("ub", "");
                      if (visible || ub.isEmpty() || ub.equals(me)) continue;
                      String kind = m.optString("kind", "text");
                      String txt = kind.equals("image") ? "📷 عکس" : kind.equals("voice") ? "🎤 پیام صوتی" : m.optString("body", "");
                      show("💬 " + m.optString("ubn", "خانواده"), txt);
                  }

                  JSONObject b2 = new JSONObject();
                  b2.put("p_home", home); b2.put("p_code", code); b2.put("p_since", hs);
                  String r2 = post(url + "/rest/v1/rpc/home_peek", key, b2.toString());
                  if (r2 != null && r2.startsWith("{")) {
                      JSONArray items = new JSONObject(r2).optJSONArray("items");
                      if (items != null) for (int i = 0; i < items.length(); i++) {
                          JSONObject x = items.getJSONObject(i);
                          long u = x.optLong("u");
                          if (u > hmx) hmx = u;
                          String ub = x.optString("ub", "");
                          if (visible || ub.isEmpty() || ub.equals(me)) continue;
                          String k = x.optString("k", "");
                          String lab = k.equals("shop") ? "🛒 لیست خرید" : k.equals("todo") ? "✅ کار جدید" : "💸 خرج جدید";
                          show(lab + " — " + x.optString("ubn", "خانواده"), x.optString("n", ""));
                      }
                  }
                  sp.edit().putLong("csince", cmx).putLong("hsince", hmx).apply();
              }

              private void show(String title, String text) {
                  Intent li = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  PendingIntent pi = PendingIntent.getActivity(this, 0, li, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new NotificationCompat.Builder(this, CH_MSG)
                      .setSmallIcon(getApplicationInfo().icon)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(text))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setDefaults(NotificationCompat.DEFAULT_ALL)
                      .setAutoCancel(true)
                      .setContentIntent(pi)
                      .build();
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.notify(++nid, n);
              }

              @Override
              public void onDestroy() {
                  running = false;
                  if (worker != null) worker.interrupt();
                  try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception ignored) {}
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          JAVA4
          cat > android/app/src/main/java/ir/dakhlkharj/app/BootReceiver.java <<'JAVA5'
          package ir.dakhlkharj.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import androidx.core.content.ContextCompat;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent intent) {
                  String h = ctx.getSharedPreferences(SyncService.PREFS, Context.MODE_PRIVATE).getString("home", "");
                  boolean on = ctx.getSharedPreferences(SyncService.PREFS, Context.MODE_PRIVATE).getBoolean("on", true);
                  if (!h.isEmpty() && on) {
                      try { ContextCompat.startForegroundService(ctx, new Intent(ctx, SyncService.class)); } catch (Exception ignored) {}
                  }
              }
          }
          JAVA5
