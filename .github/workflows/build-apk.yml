              android:widgetCategory="home_screen" />
          XML3
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_SMS" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <receiver android:name=".HomeWidget" android:exported="true" android:label="دخل و خرج خانه"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/home_widget_info" /></receiver><service android:name=".SyncService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="family chat and shopping list sync" /></service><receiver android:name=".BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter></receiver>\n    </application>#' android/app/src/main/AndroidManifest.xml
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.biometric:biometric:1.1.0"/' android/app/build.gradle
          grep -n 'biometric' android/app/build.gradle || true
      - name: Build
        run: |
          J=app/src/main/java/ir/dakhlkharj/app
          cd android && chmod +x gradlew
          if ./gradlew assembleDebug; then echo 'FULL BUILD OK'; exit 0; fi
          echo 'NATIVE FEATURES FAILED - building without them'
          cp ../bak/AndroidManifest.xml app/src/main/AndroidManifest.xml; cp ../bak/build.gradle app/build.gradle; printf 'package ir.dakhlkharj.app;\n\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {}\n' > $J/MainActivity.java
          rm -f $J/HomeNativePlugin.java $J/HomeWidget.java $J/SyncService.java $J/BootReceiver.java app/src/main/res/layout/home_widget.xml app/src/main/res/xml/home_widget_info.xml app/src/main/res/drawable/home_widget_bg.xml
          if ./gradlew assembleDebug; then exit 0; fi
          echo 'BACKGROUND RUNNER FAILED - building without it'
          cd .. && npm uninstall @capacitor/background-runner && npx cap sync android && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dakhlkharj-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
